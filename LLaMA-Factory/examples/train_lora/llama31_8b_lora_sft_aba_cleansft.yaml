### aba-cleanSFT (2026-11-10, rebuttal): plain agentic SFT on the CLEAN expert trajectories. Identical to
### llama31_8b_lora_sft_abl_nothink.yaml (ABL-A) except the dataset, which is the same 3,698 trajectories with the prompt
### injection removed from the tool observations (ablation/build_clean.py): no injection, no reflection.
### model
model_name_or_path: meta-llama/Llama-3.1-8B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: q_proj,k_proj,v_proj,o_proj
lora_rank: 64
lora_alpha: 96
lora_dropout: 0.05

### template (non-reasoning; the <think> reflection is ordinary assistant text)
template: llama3

### dataset
dataset: toucan_32B_v3_base_llama_local_clean_nothink
cutoff_len: 8192
overwrite_cache: true
preprocessing_num_workers: 8

# loss masking
train_on_prompt: false
mask_history: false

### output
output_dir: saves/llama31-8b/lora/aba_cleansft_sft_8k_r64_GA4_qkvo_3epoch_5e-6
logging_steps: 3
save_strategy: epoch
plot_loss: true
save_total_limit: 10
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 5e-6
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
flash_attn: auto
