### model
model_name_or_path: Qwen/Qwen3-8B
trust_remote_code: true
adapter_name_or_path: saves/qwen3-8b/lora/toucan_32B_v2_sft_8k_r64_GA4_qkvo_3epoch_5e-6

### method
stage: dpo
do_train: true
finetuning_type: lora
lora_target: q_proj,k_proj,v_proj,o_proj
lora_rank: 64
lora_alpha: 96
lora_dropout: 0.05
pref_beta: 0.1
pref_loss: sigmoid

### Qwen3 non-thinking
template: qwen3
enable_thinking: false

### dataset
dataset: qwen3_secalign_dpo
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 4

### output
output_dir: saves/qwen3-8b/lora/toucan_32B_v2_sft_dpo_0424
logging_steps: 1
save_strategy: epoch
plot_loss: true
save_total_limit: 10
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.6e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.0
bf16: true
flash_attn: auto
ddp_timeout: 180000000
resume_from_checkpoint: null

