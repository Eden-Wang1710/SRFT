### model
model_name_or_path: Qwen/Qwen3-8B
trust_remote_code: true

### method
stage: dpo
do_train: true
finetuning_type: lora
lora_target: q_proj,v_proj,gate_proj,up_proj,down_proj
lora_rank: 64
lora_alpha: 8
lora_dropout: 0.1
pref_beta: 0.1
pref_loss: sigmoid

### Qwen3 non-thinking
template: qwen3
enable_thinking: false

### dataset
dataset: qwen3_secalign_dpo
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 4

### output
output_dir: saves/qwen3-8b/lora/secalign_dpo_2k_r64_a8_ga16_3epoch_1.6e-4
logging_steps: 1
save_steps: 200
plot_loss: true
save_total_limit: 3
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.6e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.0
bf16: true
flash_attn: auto
ddp_timeout: 180000000
resume_from_checkpoint: null

