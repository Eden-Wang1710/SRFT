### model
model_name_or_path: Qwen/Qwen3-8B
trust_remote_code: true
adapter_name_or_path: saves/qwen3-8b/lora/toucan_v1_sft_8k_r64_GA4_qkvo_3epoch_5e-6_phase1   # change here, the SFT checkpoint for initializing the DPO training

### method
stage: dpo
do_train: true
finetuning_type: lora
lora_target: q_proj,k_proj,v_proj,o_proj
lora_rank: 64
lora_alpha: 96
lora_dropout: 0.05
pref_beta: 0.1
pref_loss: sigmoid  # choices: [sigmoid (dpo), orpo, simpo]

### Qwen3 thinking
template: qwen3
enable_thinking: true

### dataset
dataset: toucan_v1_dpo
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 4

### output
output_dir: saves/qwen3-8b/lora/toucan_v1_sft_8k_r64_GA4_qkvo_3epoch_5e-6_dpo_4k_1epoch_5.0e-6
logging_steps: 10
save_steps: 200
plot_loss: true
save_total_limit: 3
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 5.0e-6
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
flash_attn: auto
ddp_timeout: 180000000
resume_from_checkpoint: null

