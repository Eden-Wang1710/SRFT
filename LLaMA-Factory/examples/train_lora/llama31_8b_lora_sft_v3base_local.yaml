### SR-Agent-Llama (2026-09-11): paper recipe (qwen3_8b_lora_sft_v3base_traj.yaml) with ONLY the base model, template, dataset and
### output_dir changed. Data = toucan_32B_v3_base re-rendered in the AgentDojo `local` tool format (multibase/convert_llama_local.py).
### model
model_name_or_path: meta-llama/Llama-3.1-8B-Instruct
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: q_proj,k_proj,v_proj,o_proj
lora_rank: 64
lora_alpha: 96
lora_dropout: 0.05

### template (non-reasoning; the <think> reflection is ordinary assistant text)
template: llama3

### dataset
dataset: toucan_32B_v3_base_llama_local
cutoff_len: 8192
overwrite_cache: true
preprocessing_num_workers: 8

# loss masking
train_on_prompt: false
mask_history: false

### output
output_dir: saves/llama31-8b/lora/v3base_local_sft_8k_r64_GA4_qkvo_3epoch_5e-6
logging_steps: 3
save_strategy: epoch
plot_loss: true
save_total_limit: 10
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 5e-6
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
flash_attn: auto
