### model
model_name_or_path: Qwen/Qwen3-8B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: q_proj,k_proj,v_proj,o_proj  # change here
lora_rank: 64
lora_alpha: 96
lora_dropout: 0.05

### Qwen3 thinking
template: qwen3
enable_thinking: true

### dataset
dataset: toucan_32B_v3_base
cutoff_len: 8192                                             # original 2048
overwrite_cache: true
preprocessing_num_workers: 8

# loss masking
train_on_prompt: false
mask_history: false # do not mask the history for SFT

### output
# output_dir: saves/qwen3-8b/lora/toucan_email_v1_sft_8k_3epoch_1e-5                # change here
output_dir: saves/qwen3-8b/lora/v3base_traj_sft_8k_r64_GA4_qkvo_3epoch_5e-6
logging_steps: 3
save_strategy: epoch
plot_loss: true
save_total_limit: 10
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4    # change here
learning_rate: 5e-6            # change here
num_train_epochs: 3.0             # change here
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
flash_attn: auto
